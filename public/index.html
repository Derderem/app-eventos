<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />

  <!-- SEO Básico -->
  <meta name="description" content="Eventora - Encuentra eventos cerca de ti: música, gastronomía, fiestas y más." />
  <title>Eventora</title>

  <!-- OpenGraph (WhatsApp, Facebook, Telegram...) -->
  <meta property="og:title" content="Eventora - Eventos cerca de ti" />
  <meta property="og:description" content="Descubre los mejores eventos de música, gastronomía, fiestas patronales y más cerca de tu ubicación." />
  <meta property="og:image" content="https://app-eventos-pro-final.vercel.app/icon-512.png" />
  <meta property="og:url" content="https://app-eventos-pro-final.vercel.app" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Eventora" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Eventora" />
  <meta name="twitter:description" content="Eventos cerca de ti" />
  <meta name="twitter:image" content="https://app-eventos-pro-final.vercel.app/icon-512.png" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Eventora" />

  <!-- Iconos -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="shortcut icon" href="/icon-192.png" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #020617;
    }
  </style>
</head>
<body>
  <noscript>Necesitas activar JavaScript para usar Eventora.</noscript>
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('SW registrado con éxito: ', registration.scope);
          })
          .catch(error => {
            console.log('Error al registrar el SW: ', error);
          });
      });
    }
  </script>
</body>
</html>
