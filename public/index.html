<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="Eventora - Encuentra eventos cerca de ti" />
  
  <title>Eventora</title>
  
  <!-- MANIFEST PARA PWA -->
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Iconos para iPhone (Apple) -->
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Eventora" />
  
  <!-- Icono favicon estándar -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="shortcut icon" href="/icon-192.png" />
  
  <!-- Estilos del mapa Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    
    html, body, #root {
      width: 100%; 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #020617;
    }
  </style>
</head>
<body>
  <noscript>Necesitas activar JavaScript para usar Eventora.</noscript>
  <div id="root"></div>
</body>
</html>
