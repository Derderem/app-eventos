<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Eventora - Eventos cerca de ti" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link
      rel="apple-touch-icon"
      href="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/EVENTORA%20%282%29-XHiy1tMtbcc21CX0wfbs51THTEjOvx.png"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eventora" />

    <title>EVENTORA</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap");

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        background: #020617;
      }

      body {
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .leaflet-container,
      .leaflet-tile,
      .leaflet-tile-pane,
      .leaflet-layer {
        filter: none !important;
        -webkit-filter: none !important;
      }

      .leaflet-container {
        width: 100%;
        height: 100% !important;
      }
    </style>
  </head>

  <body>
    <noscript>Necesitas activar JavaScript para usar Eventora.</noscript>
    <div id="root"></div>
  </body>
</html>
